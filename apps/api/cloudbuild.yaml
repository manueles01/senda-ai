steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/senda-api:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/senda-api:latest', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/senda-api:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/senda-api:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'senda-api'
      - '--image=gcr.io/$PROJECT_ID/senda-api:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=60s'
      - '--set-secrets=PHOREST_USERNAME=PHOREST_USERNAME:latest,PHOREST_PASSWORD=PHOREST_PASSWORD:latest,PHOREST_BUSINESS_ID=PHOREST_BUSINESS_ID:latest,PHOREST_BRANCH_ID=PHOREST_BRANCH_ID:latest,TELNYX_API_KEY=TELNYX_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--set-env-vars=PHOREST_BASE_URL=https://api-gateway-us.phorest.com,SALON_TIMEZONE=America/New_York,TELNYX_PHONE_NUMBER=+16815080516'

images:
  - 'gcr.io/$PROJECT_ID/senda-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/senda-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
